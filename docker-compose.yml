services:
  app:
    build: .
    ports:
      - "3456:3456"
    environment:
      # NextAuth v5 refuses to trust the request's Host header by default
      # (to stop host-header spoofing) unless explicitly told to — needed
      # here since the container itself has no way to know its own public
      # URL/domain ahead of time. Safe as long as this container only ever
      # sits behind a reverse proxy you control (or is only exposed on a
      # trusted LAN), same as any other self-hosted NextAuth deployment.
      AUTH_TRUST_HOST: "true"
    env_file:
      # Copy .env.local.example to .env.local and fill in real secrets
      # first (see README "Setup" / "Running with Docker"). This is where
      # DATABASE_URL/DATABASE_PROVIDER are set too — not hardcoded here —
      # so switching to Postgres/Supabase is just an env change, no edits
      # to this file needed. Not baked into the image (see .dockerignore),
      # only loaded at container start.
      - .env.local
    volumes:
      # Where the SQLite file lives is controlled entirely by SQLITE_MOUNT
      # (set in the shell or in .env.local, NOT hardcoded here) so there
      # are two clean options without editing this file:
      #
      #   - Unset (default): "app_data:/app/data" — a Docker-managed named
      #     volume. Nothing is created on the host filesystem; the DB file
      #     is created inside the volume on first run and reused by that
      #     same volume on every subsequent run, restart, or rebuild.
      #
      #   - Set to an existing host file, e.g.
      #     SQLITE_MOUNT="./data/dev.db:/app/data/dev.db" — bind-mounts
      #     that exact file into the container so it's reused as-is. Only
      #     set this when the file already exists: bind-mounting a
      #     *missing* file path makes Docker create a directory there
      #     instead (a long-standing Docker Engine quirk), which is why
      #     this isn't the default.
      #
      # Either way, DATABASE_URL (see below) must point at wherever this
      # ends up mounted inside the container.
      - ${SQLITE_MOUNT:-app_data:/app/data}
    restart: unless-stopped

volumes:
  app_data:
