services:
  app:
    build: .
    ports:
      - "3456:3456"
    environment:
      # NextAuth v5 refuses to trust the request's Host header by default
      # (to stop host-header spoofing) unless explicitly told to — needed
      # here since the container itself has no way to know its own public
      # URL/domain ahead of time. Safe as long as this container only ever
      # sits behind a reverse proxy you control (or is only exposed on a
      # trusted LAN), same as any other self-hosted NextAuth deployment.
      AUTH_TRUST_HOST: "true"
    env_file:
      # Copy .env.local.example to .env.local and fill in real secrets
      # first (see README "Setup" / "Running with Docker"). This is where
      # DATABASE_URL/DATABASE_PROVIDER are set too — not hardcoded here —
      # so switching to Postgres/Supabase is just an env change, no edits
      # to this file needed. Not baked into the image (see .dockerignore),
      # only loaded at container start.
      - .env.local
    volumes:
      # /app/data (named volume `app_data`) is where the live, persistent
      # SQLite file actually lives and is read/written from at runtime —
      # this alone is enough for the container to keep reusing its own
      # data across restarts/rebuilds indefinitely, on its own, with
      # nothing created on the host filesystem.
      #
      # ./prisma is additionally bind-mounted read-only at /host-prisma so
      # docker-entrypoint.sh can detect and prioritize an *existing* local
      # dev.db (e.g. from `npm run dev`) the very first time the volume is
      # empty: if you already have prisma/dev.db, it's copied in as the
      # starting point instead of creating a brand new empty database. This
      # is read-only and one-way (host → container, once) — the running
      # container's writes only ever go to the app_data volume, never back
      # to your host's dev.db, so local (non-Docker) dev is unaffected.
      - app_data:/app/data
      - ./prisma:/host-prisma:ro
    restart: unless-stopped

volumes:
  app_data:
