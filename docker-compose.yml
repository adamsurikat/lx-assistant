services:
  app:
    build: .
    ports:
      - "3456:3456"
    environment:
      # NextAuth v5 refuses to trust the request's Host header by default
      # (to stop host-header spoofing) unless explicitly told to — needed
      # here since the container itself has no way to know its own public
      # URL/domain ahead of time. Safe as long as this container only ever
      # sits behind a reverse proxy you control (or is only exposed on a
      # trusted LAN), same as any other self-hosted NextAuth deployment.
      AUTH_TRUST_HOST: "true"
    env_file:
      # Copy .env.local.example to .env.local and fill in real secrets
      # first (see README "Setup" / "Running with Docker"). This is where
      # DATABASE_URL/DATABASE_PROVIDER are set too — not hardcoded here —
      # so switching to Postgres/Supabase is just an env change, no edits
      # to this file needed. Not baked into the image (see .dockerignore),
      # only loaded at container start.
      - .env.local
    volumes:
      # Bind-mounted (not a named volume) so the default SQLite setup
      # reuses ./data/dev.db as-is if it already exists on the host — e.g.
      # from a previous run — instead of always starting from an empty
      # database. Irrelevant when DATABASE_URL points at Postgres/Supabase
      # instead, but harmless to leave mounted either way.
      - ./data:/app/data
    restart: unless-stopped
